[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tip"
version = "0.1.0"
description = "Threat Intelligence Platform: IOC ingestion, enrichment, scoring, correlation and matching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tip = "tip.cli:main"

[tool.setuptools]
packages = ["tip", "tip.feeds", "tip.enrichment"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
